<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DARWIN — El marketing evoluciona solo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --stage-bg: #080a08;
      --slide-bg: #0d100d;
      --ivory: #eee9de;
      --sage: #a7b29d;
      --copper: #d48f66;
      --moss: #3b6a50;
      --rose: #bb786e;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
    .deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
    .deck-stage {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
      overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff);
    }
    .slide {
      position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
      display: block; visibility: hidden; opacity: 0; pointer-events: none;
      background: var(--slide-bg, #fff);
    }
    .slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
    img, video, canvas, svg { max-width: 100%; max-height: 100%; }
    .deck-controls {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000;
    }
    @media print {
      html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
      .deck-viewport { position: static; overflow: visible; background: #fff; }
      .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
      .slide {
        position: relative; display: block !important; visibility: visible !important;
        opacity: 1 !important; pointer-events: auto !important; width: 1920px; height: 1080px;
        break-after: page; page-break-after: always;
      }
      .slide:last-child { break-after: auto; page-break-after: auto; }
      .deck-controls { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .2s !important; }
    }

    /* === NOCTURNAL BIOME === */
    .biome {
      color: var(--ivory);
      font-family: "IBM Plex Sans", sans-serif;
      background:
        radial-gradient(circle at 80% 31%, rgba(59,106,80,.2), transparent 27%),
        radial-gradient(circle at 24% 85%, rgba(187,120,110,.1), transparent 22%),
        #0d100d;
    }
    .grain {
      position: absolute; inset: 0; opacity: .17; pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.22) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.14) 0 1px, transparent 1.5px);
      background-size: 17px 19px, 23px 29px;
      mix-blend-mode: soft-light;
    }
    .meta {
      position: absolute; top: 62px; left: 72px; right: 72px;
      display: flex; justify-content: space-between; align-items: center;
      color: var(--sage); font-size: 16px; letter-spacing: .18em; text-transform: uppercase;
      animation: fade-in .6s ease-out both;
    }
    .meta span:first-child::before {
      content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 13px;
      border-radius: 50%; background: var(--copper); box-shadow: 0 0 18px rgba(212,143,102,.7);
    }
    .copy { position: absolute; left: 92px; top: 246px; width: 990px; z-index: 3; }
    .kicker {
      margin: 0 0 42px; color: var(--copper); font-size: 18px;
      letter-spacing: .18em; text-transform: uppercase;
      animation: rise .55s .2s ease-out both;
    }
    h1 {
      margin: 0; font-family: "Cormorant Garamond", serif;
      font-size: 244px; font-weight: 500; line-height: .73; letter-spacing: -.075em;
      animation: title-bloom 1.1s .28s cubic-bezier(.16,1,.3,1) both;
    }
    .tagline {
      margin: 66px 0 0 8px; width: 670px;
      font-family: "Cormorant Garamond", serif; font-size: 49px; font-style: italic;
      line-height: 1.04; color: #d5d0c6;
      animation: rise .7s .85s ease-out both;
    }
    .organism {
      position: absolute; width: 720px; height: 720px; right: 72px; top: 174px;
      animation: organism-in 1.1s .15s cubic-bezier(.16,1,.3,1) both;
    }
    .membrane {
      position: absolute; inset: 47px;
      border: 1px solid rgba(238,233,222,.3); border-radius: 46% 54% 62% 38% / 54% 36% 64% 46%;
      background:
        radial-gradient(circle at 34% 35%, rgba(212,143,102,.47), transparent 18%),
        radial-gradient(circle at 68% 62%, rgba(59,106,80,.75), transparent 30%),
        radial-gradient(circle at 45% 50%, rgba(187,120,110,.34), transparent 46%);
      box-shadow: inset 0 0 80px rgba(238,233,222,.05), 0 0 100px rgba(59,106,80,.1);
      animation: breathe 8s ease-in-out infinite alternate, drift 18s linear infinite;
    }
    .membrane::before, .membrane::after {
      content: ""; position: absolute; border: 1px solid rgba(238,233,222,.35);
      border-radius: 50%; background: rgba(13,16,13,.32); backdrop-filter: blur(8px);
    }
    .membrane::before { width: 170px; height: 170px; left: 144px; top: 116px; }
    .membrane::after { width: 96px; height: 96px; right: 126px; bottom: 132px; border-color: rgba(212,143,102,.7); }
    .spore {
      position: absolute; width: var(--s); height: var(--s);
      left: var(--x); top: var(--y); border-radius: 50%;
      background: var(--c); box-shadow: 0 0 25px color-mix(in srgb, var(--c), transparent 35%);
      animation: spore-pop .55s calc(.65s + var(--i) * .13s) cubic-bezier(.16,1,.3,1) both,
                 float 5s calc(var(--i) * -.8s) ease-in-out infinite alternate;
    }
    .rule {
      position: absolute; left: 72px; right: 72px; bottom: 84px; height: 1px;
      background: linear-gradient(90deg, var(--copper), rgba(238,233,222,.28) 34%, transparent);
      animation: draw 1s 1.05s ease-out both;
    }
    .footer {
      position: absolute; left: 72px; right: 72px; bottom: 44px;
      display: flex; justify-content: space-between;
      color: var(--sage); font-size: 14px; letter-spacing: .15em; text-transform: uppercase;
      animation: fade-in .55s 1.22s ease-out both;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes title-bloom {
      from { opacity: 0; transform: translateY(44px) scale(.97); filter: blur(12px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes organism-in { from { opacity: 0; transform: scale(.8) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes breathe { from { transform: scale(.97); } to { transform: scale(1.025); } }
    @keyframes drift { to { rotate: 360deg; } }
    @keyframes spore-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { from { translate: 0 -8px; } to { translate: 0 12px; } }
    @keyframes draw { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }
  </style>
</head>
<body>
  <main class="deck-viewport">
    <div class="deck-stage">
      <section class="slide biome active">
        <div class="grain"></div>
        <header class="meta">
          <span>Distribution intelligence · living system</span>
          <span>Platanus Build Night · Bogotá</span>
        </header>
        <div class="copy">
          <p class="kicker">Evidence adapts. Winners reproduce.</p>
          <h1>DARWIN</h1>
          <p class="tagline">El marketing evoluciona solo.</p>
        </div>
        <div class="organism" aria-hidden="true">
          <div class="membrane"></div>
          <i class="spore" style="--s:18px;--x:12%;--y:22%;--c:#d48f66;--i:0"></i>
          <i class="spore" style="--s:10px;--x:84%;--y:30%;--c:#a7b29d;--i:1"></i>
          <i class="spore" style="--s:24px;--x:77%;--y:78%;--c:#bb786e;--i:2"></i>
          <i class="spore" style="--s:13px;--x:19%;--y:74%;--c:#3b6a50;--i:3"></i>
          <i class="spore" style="--s:8px;--x:51%;--y:3%;--c:#eee9de;--i:4"></i>
        </div>
        <div class="rule"></div>
        <footer class="footer">
          <span>Evidencia → ejecución → selección → memoria</span>
          <span>Human GO required</span>
        </footer>
      </section>
    </div>
  </main>
  <script>
    function scaleStage() {
      const stage = document.querySelector('.deck-stage');
      const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = `translate(${(innerWidth - 1920 * scale) / 2}px, ${(innerHeight - 1080 * scale) / 2}px) scale(${scale})`;
    }
    addEventListener('resize', scaleStage); scaleStage();
  </script>
</body>
</html>
